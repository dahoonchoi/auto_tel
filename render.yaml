services:
  - type: web
    name: flowoom-checker
    env: python
    buildCommand: |
      apt-get update
      apt-get install -y wget unzip xvfb libxi6 libgconf-2-4 libxrandr2 libxss1 libxcursor1 libxcomposite1 libasound2 libgtk-3-0
      wget https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
      apt install -y ./google-chrome-stable_current_amd64.deb
      pip install -r requirements.txt
    startCommand: python index.py
